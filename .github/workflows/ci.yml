name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
      - name: Install the Slang compiler
        run: |
          curl -sSL https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-x86_64.tar.gz -o slang.tar.gz
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang" && rm slang.tar.gz
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Formatting
        run: zig fmt --check build.zig build libs/limn libs/slime/build.zig
      - name: Compile everything and its tests
        run: zig build check
      - name: Unit tests
        run: zig build test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Compile everything and its tests
        run: zig build check
      - name: Unit tests
        run: zig build test
